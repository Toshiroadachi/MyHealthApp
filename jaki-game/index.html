<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>潜入作戦 ジャキ城奪還</title>
<style>
  /* ===== 画面全体のスタイル ===== */
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #111; color: #eee;
    overflow: hidden;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    touch-action: none;              /* スマホでスクロール・拡大させない */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* ===== タッチ操作用ボタン ===== */
  #pad {
    position: fixed; left: 20px; bottom: 20px;
    width: 140px; height: 140px; border-radius: 50%;
    background: rgba(255,255,255,0.10);
    border: 2px solid rgba(255,255,255,0.25);
    touch-action: none;
  }
  #knob {
    position: absolute; left: 50%; top: 50%;
    width: 56px; height: 56px; margin: -28px 0 0 -28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    pointer-events: none;
  }
  /* 十字の目印 */
  #pad::before, #pad::after {
    content: ""; position: absolute; background: rgba(255,255,255,0.15);
  }
  #pad::before { left: 50%; top: 12px; bottom: 12px; width: 2px; margin-left: -1px; }
  #pad::after  { top: 50%; left: 12px; right: 12px; height: 2px; margin-top: -1px; }

  #actBtn {
    position: fixed; right: 24px; bottom: 36px;
    width: 96px; height: 96px; border-radius: 50%;
    background: rgba(220,80,60,0.35);
    border: 2px solid rgba(255,160,140,0.6);
    color: #fff; font-size: 16px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  #actBtn.on { background: rgba(220,80,60,0.7); }
  /* マウス操作のPCでは少し控えめに表示 */
  @media (hover: hover) and (pointer: fine) {
    #pad, #actBtn { opacity: 0.45; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="pad"><div id="knob"></div></div>
<div id="actBtn">ACTION</div>

<script>
'use strict';

/* =========================================================
   基本設定
   ========================================================= */
const TILE = 40;                 // 1マスの大きさ（ピクセル）
const PLAYER_SPEED = 150;        // 通常の移動速度（px/秒）
const CROUCH_SPEED = 70;         // ほふく時の移動速度
const PLAYER_R = 12;             // プレイヤーの当たり判定の半径
const GUARD_R = 13;              // 見張りの当たり判定の半径
const VIEW_RANGE = 220;          // 見張りの視界の距離
const VIEW_ANGLE = Math.PI / 2.6;// 見張りの視野角（全体）
const CROUCH_RANGE_RATE = 0.6;   // ほふく中は見つかる距離が短くなる
const STUN_TIME = 10;            // 気絶させた時間（秒）

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

/* =========================================================
   ステージデータ
   ・座標はすべて「マス」単位（ゲーム内でピクセルに変換）
   ・後でステージ2〜4を追加しやすいよう配列にしている
   ========================================================= */
const STAGES = [
  {
    name: 'STAGE 1  城外の荒野',
    cols: 40, rows: 25,
    start: [2, 12],
    goal: [37, 11, 2, 3],            // 脱出（到達）地点 [x, y, 幅, 高さ]
    // 岩（通れない・視線を遮る）
    rocks: [
      [6,4,2,3],[5,17,3,2],[11,6,3,3],[11,15,2,4],[15,2,2,5],[15,19,2,4],
      [20,9,2,2],[20,14,2,2],[24,3,3,2],[24,20,3,2],[23,11,1,3],
      [29,7,2,3],[29,15,2,3],[33,2,2,2],[33,21,2,2],
    ],
    // 城壁（通れない・視線を遮る）。右端が城、門の部分だけ開いている
    walls: [
      [36,0,4,11],[36,14,4,11],
    ],
    // 草むら（通れる。ほふくで入ると隠れられる）
    bushes: [
      [13,10,3,5],[18,2,3,3],[18,19,3,3],[26,10,2,5],[31,11,2,3],[8,9,2,2],
    ],
    // 見張り
    //  type 'patrol' : 巡回ルート（waypoints）を往復・周回
    //  type 'turn'   : その場で首を振る（center: 向きの中心, amp: 振れ幅）
    guards: [
      { type: 'patrol', waypoints: [[17.5,7.5],[17.5,17.5]], loop: false },
      { type: 'patrol', waypoints: [[19.5,6.5],[27.5,6.5]], loop: false },
      { type: 'patrol', waypoints: [[27.5,17.5],[19.5,17.5]], loop: false },
      { type: 'patrol', waypoints: [[28.5,5.5],[32.5,5.5],[32.5,19.5],[28.5,19.5]], loop: true },
      { type: 'turn', pos: [34.5,12.5], center: Math.PI, amp: 0.9 },
    ],
    // ヒント（その範囲に入ると画面下に表示）
    hints: [
      { area: [0,0,9,25],  text: '矢印キー（スマホは左下のパッド）で移動。右端の城門をめざせ。' },
      { area: [9,0,9,25],  text: '黄色い扇形が見張りの視界。岩は視線をさえぎる。SPACEでほふく → 見つかりにくく、草むらに隠れられる。' },
      { area: [18,0,10,25],text: '見張りの背後に近づいて SPACE で気絶させられる（約10秒）。' },
      { area: [28,0,8,25], text: '警戒度が100%でゲームオーバー。光っている城門に入ればクリア！' },
    ],
    intro: '人質が囚われているジャキ城へ潜入せよ。まずは城外の荒野を抜け、城門へ向かえ。',
  },
];

/* =========================================================
   ゲームの状態
   ========================================================= */
let scene = 'title';      // 'title' | 'play' | 'clear' | 'over'
let stageIndex = 0;
let stage = null;         // 現在のステージデータ
let grid = null;          // 当たり判定用のマス目（0:空き 1:岩 2:壁）
let bushGrid = null;      // 草むらのマス目
let player = null;
let guards = [];
let alertLevel = 0;       // 警戒度（0〜100）
let elapsed = 0;          // 経過時間
let overReason = '';
let introTimer = 0;
let staticLayer = null;   // 地面・岩・壁を事前描画した画像
let bushLayer = null;     // 草むらを事前描画した画像

/* =========================================================
   入力（キーボード＋タッチ）
   ========================================================= */
const keys = {};
const touchVec = { x: 0, y: 0 };

window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Space'].includes(e.key) || e.code === 'Space') {
    e.preventDefault();
  }
  if (e.repeat) return;
  keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'Enter') onAction();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// --- 仮想パッド（ドラッグした方向に移動） ---
const pad = document.getElementById('pad');
const knob = document.getElementById('knob');
let padId = null;
function updatePad(e) {
  const r = pad.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2);
  let dy = e.clientY - (r.top + r.height / 2);
  const max = r.width / 2;
  const len = Math.hypot(dx, dy);
  if (len > max) { dx = dx / len * max; dy = dy / len * max; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  // 中心付近は反応させない（遊び）
  if (len < 12) { touchVec.x = 0; touchVec.y = 0; return; }
  touchVec.x = dx / max;
  touchVec.y = dy / max;
}
pad.addEventListener('pointerdown', e => {
  padId = e.pointerId; pad.setPointerCapture(e.pointerId); updatePad(e); e.preventDefault();
});
pad.addEventListener('pointermove', e => { if (e.pointerId === padId) updatePad(e); });
const padEnd = e => {
  if (e.pointerId !== padId) return;
  padId = null; touchVec.x = 0; touchVec.y = 0; knob.style.transform = '';
};
pad.addEventListener('pointerup', padEnd);
pad.addEventListener('pointercancel', padEnd);

// --- アクションボタン ---
const actBtn = document.getElementById('actBtn');
actBtn.addEventListener('pointerdown', e => { e.preventDefault(); actBtn.classList.add('on'); onAction(); });
actBtn.addEventListener('pointerup', () => actBtn.classList.remove('on'));
actBtn.addEventListener('pointercancel', () => actBtn.classList.remove('on'));
// タイトル画面などでは画面タップでも開始できる
canvas.addEventListener('pointerdown', () => { if (scene !== 'play') onAction(); });

// 移動方向を取得（キーボードとタッチを合成）
function getMoveVec() {
  let x = 0, y = 0;
  if (keys.ArrowLeft || keys.KeyA) x -= 1;
  if (keys.ArrowRight || keys.KeyD) x += 1;
  if (keys.ArrowUp || keys.KeyW) y -= 1;
  if (keys.ArrowDown || keys.KeyS) y += 1;
  x += touchVec.x; y += touchVec.y;
  const len = Math.hypot(x, y);
  if (len > 1) { x /= len; y /= len; }
  return { x, y };
}

// スペース／アクションボタンが押されたとき
function onAction() {
  if (scene === 'title') { startStage(0); return; }
  if (scene === 'over')  { startStage(stageIndex); return; }
  if (scene === 'clear') { scene = 'title'; return; }
  if (scene !== 'play') return;

  // 背後から気絶させられる見張りがいれば気絶、いなければ「ほふく」切り替え
  const target = findStunTarget();
  if (target) {
    target.state = 'stun';
    target.stunTimer = STUN_TIME;
    target.susp = 0;
  } else {
    player.crouch = !player.crouch;
  }
}

/* =========================================================
   ステージの準備
   ========================================================= */
function startStage(index) {
  stageIndex = index;
  stage = STAGES[index];
  const { cols, rows } = stage;

  // マス目を作成（外周は岩で囲む。ただし城壁の部分はそのまま）
  grid = [];
  bushGrid = [];
  for (let y = 0; y < rows; y++) {
    grid.push(new Array(cols).fill(0));
    bushGrid.push(new Array(cols).fill(false));
  }
  for (let x = 0; x < cols; x++) { grid[0][x] = 1; grid[rows - 1][x] = 1; }
  for (let y = 0; y < rows; y++) { grid[y][0] = 1; }
  const fill = (rects, v) => rects.forEach(([rx, ry, rw, rh]) => {
    for (let y = ry; y < ry + rh; y++)
      for (let x = rx; x < rx + rw; x++)
        if (grid[y] && x < cols) grid[y][x] = v;
  });
  fill(stage.rocks, 1);
  fill(stage.walls, 2);
  stage.bushes.forEach(([rx, ry, rw, rh]) => {
    for (let y = ry; y < ry + rh; y++)
      for (let x = rx; x < rx + rw; x++) bushGrid[y][x] = true;
  });

  // プレイヤー
  player = {
    x: (stage.start[0] + 0.5) * TILE, y: (stage.start[1] + 0.5) * TILE,
    dir: 0, crouch: false, walk: 0,
  };

  // 見張り
  guards = stage.guards.map(g => {
    const p = g.type === 'turn' ? g.pos : g.waypoints[0];
    return {
      ...g,
      x: p[0] * TILE, y: p[1] * TILE,
      homeX: p[0] * TILE, homeY: p[1] * TILE,
      dir: g.type === 'turn' ? g.center : 0,
      wp: 1, wpStep: 1,
      wait: 0,
      state: 'patrol',     // 'patrol' | 'alert' | 'search' | 'return' | 'stun'
      susp: 0,             // 怪しさ（1で発見）
      seen: false,         // 今プレイヤーが見えているか
      lastX: 0, lastY: 0,  // 最後にプレイヤーを見た位置
      lostTimer: 0, searchTimer: 0, stunTimer: 0,
      phase: Math.random() * 6,
    };
  });

  alertLevel = 0;
  elapsed = 0;
  introTimer = 5;
  buildLayers();
  resize();
  scene = 'play';
}

/* =========================================================
   当たり判定まわり
   ========================================================= */
// その座標が通れないマスか
function solidAt(px, py) {
  const tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
  if (ty < 0 || ty >= stage.rows || tx < 0 || tx >= stage.cols) return true;
  return grid[ty][tx] !== 0;
}
// 円（半径r）がどこかの壁に重なっているか
function circleHitsWall(x, y, r) {
  const x0 = Math.floor((x - r) / TILE), x1 = Math.floor((x + r) / TILE);
  const y0 = Math.floor((y - r) / TILE), y1 = Math.floor((y + r) / TILE);
  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      if (ty < 0 || ty >= stage.rows || tx < 0 || tx >= stage.cols) return true;
      if (grid[ty][tx] === 0) continue;
      // 円と四角形の最近点で判定
      const cx = Math.max(tx * TILE, Math.min(x, (tx + 1) * TILE));
      const cy = Math.max(ty * TILE, Math.min(y, (ty + 1) * TILE));
      if ((x - cx) ** 2 + (y - cy) ** 2 < r * r) return true;
    }
  }
  return false;
}
// 壁で止まりながら移動（X方向とY方向を別々に判定して壁沿いに滑らせる）
function moveWithCollision(obj, dx, dy, r) {
  if (!circleHitsWall(obj.x + dx, obj.y, r)) obj.x += dx;
  if (!circleHitsWall(obj.x, obj.y + dy, r)) obj.y += dy;
}
// 2点間の視線が通るか（岩や壁で遮られていないか）
function lineOfSight(x1, y1, x2, y2) {
  const d = Math.hypot(x2 - x1, y2 - y1);
  const steps = Math.ceil(d / 6);
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    if (solidAt(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t)) return false;
  }
  return true;
}
// 角度の差を -π〜π に正規化
function angleDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}
// 向きをなめらかに目標へ回転
function turnToward(g, target, speed, dt) {
  const d = angleDiff(target, g.dir);
  const step = speed * dt;
  g.dir += Math.abs(d) < step ? d : Math.sign(d) * step;
}
function inBush(x, y) {
  const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
  return !!(bushGrid[ty] && bushGrid[ty][tx]);
}

/* =========================================================
   見張りが プレイヤーを見ているか
   ========================================================= */
function guardCanSee(g) {
  if (g.state === 'stun') return false;
  const dx = player.x - g.x, dy = player.y - g.y;
  const dist = Math.hypot(dx, dy);
  // ほふく中は見つかる距離が短い
  let range = VIEW_RANGE * (player.crouch ? CROUCH_RANGE_RATE : 1);
  if (g.state === 'alert') range = VIEW_RANGE * 1.2; // 警戒中はよく見ている
  // ほふくで草むらに隠れていると、すぐ近く以外は見えない
  if (player.crouch && inBush(player.x, player.y) && g.state !== 'alert') range = 45;
  if (dist > range) return false;
  // すぐ近く（体が触れるほど）なら向きに関係なく気づく
  if (dist > 30 && Math.abs(angleDiff(Math.atan2(dy, dx), g.dir)) > VIEW_ANGLE / 2) return false;
  return lineOfSight(g.x, g.y, player.x, player.y);
}

// 背後から気絶させられる見張りを探す
function findStunTarget() {
  for (const g of guards) {
    if (g.state === 'stun' || g.state === 'alert') continue;
    const dx = player.x - g.x, dy = player.y - g.y;
    if (Math.hypot(dx, dy) > 40) continue;
    // 見張りの向きと、見張り→プレイヤー方向の差が大きい＝背後
    if (Math.abs(angleDiff(Math.atan2(dy, dx), g.dir)) > Math.PI * 0.55) return g;
  }
  return null;
}

/* =========================================================
   更新処理
   ========================================================= */
function update(dt) {
  if (scene !== 'play') return;
  elapsed += dt;
  if (introTimer > 0) introTimer -= dt;

  // --- プレイヤーの移動 ---
  const mv = getMoveVec();
  const speed = player.crouch ? CROUCH_SPEED : PLAYER_SPEED;
  if (mv.x || mv.y) {
    player.dir = Math.atan2(mv.y, mv.x);
    player.walk += dt * (player.crouch ? 6 : 12);
    moveWithCollision(player, mv.x * speed * dt, mv.y * speed * dt, PLAYER_R);
  }

  // --- 見張りの行動 ---
  let anyAlert = false;
  for (const g of guards) {
    updateGuard(g, dt);
    if (g.state === 'alert') anyAlert = true;
    // 警戒中の見張りに捕まったら即ゲームオーバー
    if (g.state === 'alert' && Math.hypot(player.x - g.x, player.y - g.y) < PLAYER_R + GUARD_R) {
      gameOver('見張りに捕まった！');
      return;
    }
  }

  // --- 警戒度 ---
  // 見つかっていない間はゆっくり下がる
  if (!anyAlert) alertLevel = Math.max(0, alertLevel - 4 * dt);
  if (alertLevel >= 100) { gameOver('警戒度が最大になった！'); return; }

  // --- ゴール判定 ---
  const [gx, gy, gw, gh] = stage.goal;
  if (player.x > gx * TILE && player.x < (gx + gw) * TILE &&
      player.y > gy * TILE && player.y < (gy + gh) * TILE) {
    scene = 'clear';
  }
}

function updateGuard(g, dt) {
  const PATROL_SPEED = 55, CHASE_SPEED = 125;

  // 気絶中
  if (g.state === 'stun') {
    g.stunTimer -= dt;
    if (g.stunTimer <= 0) { g.state = 'return'; }
    return;
  }

  // プレイヤーが見えるか
  g.seen = guardCanSee(g);
  if (g.seen) { g.lastX = player.x; g.lastY = player.y; }

  if (g.state === 'alert') {
    // --- 警戒状態：プレイヤーを追いかける ---
    if (g.seen) {
      g.lostTimer = 0;
      alertLevel = Math.min(100, alertLevel + 22 * dt);
    } else {
      g.lostTimer += dt;
      if (g.lostTimer > 3) { g.state = 'search'; g.searchTimer = 3; g.susp = 0.5; }
    }
    moveGuardTo(g, g.lastX, g.lastY, CHASE_SPEED, dt);
    return;
  }

  // --- 怪しさの増減 ---
  if (g.seen) {
    const dist = Math.hypot(player.x - g.x, player.y - g.y);
    // 近いほど早く気づく
    g.susp += dt * (0.5 + 2.2 * (1 - dist / VIEW_RANGE));
    if (g.susp >= 1) {
      g.susp = 1;
      g.state = 'alert';
      g.lostTimer = 0;
      alertLevel = Math.min(100, alertLevel + 30);  // 発見された瞬間に大きく上がる
      return;
    }
  } else {
    g.susp = Math.max(0, g.susp - dt * 0.35);
  }

  // 少し怪しいと思ったら立ち止まってその方向を見る
  if (g.susp > 0.25) {
    turnToward(g, Math.atan2(g.lastY - g.y, g.lastX - g.x), 3, dt);
    return;
  }

  if (g.state === 'search') {
    // --- 捜索：最後に見た地点まで行き、周りを見回す ---
    const arrived = moveGuardTo(g, g.lastX, g.lastY, PATROL_SPEED * 1.4, dt);
    if (arrived) {
      g.dir += dt * 2.5;
      g.searchTimer -= dt;
      if (g.searchTimer <= 0) g.state = 'return';
    }
    return;
  }

  if (g.state === 'return') {
    // --- 持ち場へ戻る ---
    let tx = g.homeX, ty = g.homeY;
    if (g.type === 'patrol') { const p = g.waypoints[g.wp]; tx = p[0] * TILE; ty = p[1] * TILE; }
    if (moveGuardTo(g, tx, ty, PATROL_SPEED * 1.2, dt)) g.state = 'patrol';
    return;
  }

  // --- 通常の巡回 ---
  if (g.type === 'turn') {
    // その場で首を左右に振る
    g.phase += dt * 0.8;
    const target = g.center + Math.sin(g.phase) * g.amp;
    turnToward(g, target, 2, dt);
    return;
  }
  if (g.wait > 0) { g.wait -= dt; return; }
  const p = g.waypoints[g.wp];
  if (moveGuardTo(g, p[0] * TILE, p[1] * TILE, PATROL_SPEED, dt)) {
    g.wait = 1.2;   // 曲がり角で少し立ち止まる
    if (g.loop) {
      g.wp = (g.wp + 1) % g.waypoints.length;
    } else {
      // 往復：端に着いたら折り返す
      if (g.wp + g.wpStep >= g.waypoints.length || g.wp + g.wpStep < 0) g.wpStep *= -1;
      g.wp += g.wpStep;
    }
  }
}

// 見張りを目標地点へ動かす。着いたら true を返す
function moveGuardTo(g, tx, ty, speed, dt) {
  const dx = tx - g.x, dy = ty - g.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 4) return true;
  const ang = Math.atan2(dy, dx);
  turnToward(g, ang, 5, dt);
  const step = Math.min(dist, speed * dt);
  moveWithCollision(g, Math.cos(ang) * step, Math.sin(ang) * step, GUARD_R);
  return false;
}

function gameOver(reason) {
  overReason = reason;
  scene = 'over';
}

/* =========================================================
   描画
   ========================================================= */
let viewW = 800, viewH = 450, zoom = 1, dpr = 1;
function resize() {
  dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  // 画面サイズに合わせて表示倍率を決める（スマホ縦でも見やすく）
  zoom = Math.max(0.55, Math.min(window.innerWidth / 760, window.innerHeight / 480));
  // ステージより画面が大きくなって黒い余白が出ないよう、最低倍率を調整
  if (stage) zoom = Math.max(zoom, window.innerWidth / (stage.cols * TILE), window.innerHeight / (stage.rows * TILE));
  viewW = window.innerWidth / zoom;
  viewH = window.innerHeight / zoom;
}
window.addEventListener('resize', resize);
resize();

// 疑似乱数（毎回同じ模様になるように）
function seededRandom(seed) {
  return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
}

// 地面・岩・壁・草むらを事前に描いておく（毎フレーム描くと重いため）
function buildLayers() {
  const W = stage.cols * TILE, H = stage.rows * TILE;
  const rnd = seededRandom(12345);

  staticLayer = document.createElement('canvas');
  staticLayer.width = W; staticLayer.height = H;
  const c = staticLayer.getContext('2d');

  // 荒野の地面
  c.fillStyle = '#b89a6a';
  c.fillRect(0, 0, W, H);
  for (let i = 0; i < 2500; i++) {
    c.fillStyle = rnd() < 0.5 ? 'rgba(90,60,30,0.15)' : 'rgba(255,240,200,0.15)';
    const s = 1 + rnd() * 3;
    c.fillRect(rnd() * W, rnd() * H, s, s);
  }
  // 轍（わだち）っぽい道
  c.strokeStyle = 'rgba(120,90,50,0.25)';
  c.lineWidth = 18;
  c.beginPath(); c.moveTo(0, 12.5 * TILE);
  c.bezierCurveTo(10 * TILE, 9 * TILE, 25 * TILE, 16 * TILE, 37 * TILE, 12.5 * TILE);
  c.stroke();

  // 岩
  for (let y = 0; y < stage.rows; y++) {
    for (let x = 0; x < stage.cols; x++) {
      if (grid[y][x] === 1) {
        const px = x * TILE, py = y * TILE;
        c.fillStyle = '#6b5a48';
        c.fillRect(px, py, TILE, TILE);
        c.fillStyle = '#857057';
        c.beginPath();
        c.moveTo(px + 4 + rnd() * 6, py + 6 + rnd() * 6);
        c.lineTo(px + TILE - 6 - rnd() * 6, py + 4 + rnd() * 6);
        c.lineTo(px + TILE - 4 - rnd() * 6, py + TILE - 8 - rnd() * 6);
        c.lineTo(px + 6 + rnd() * 6, py + TILE - 6 - rnd() * 6);
        c.closePath(); c.fill();
        c.strokeStyle = 'rgba(0,0,0,0.25)'; c.lineWidth = 1;
        c.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);
      } else if (grid[y][x] === 2) {
        // 城壁（レンガ模様）
        const px = x * TILE, py = y * TILE;
        c.fillStyle = '#7d7d86';
        c.fillRect(px, py, TILE, TILE);
        c.strokeStyle = '#5a5a63'; c.lineWidth = 2;
        for (let r = 0; r < 4; r++) {
          const yy = py + r * 10;
          c.beginPath(); c.moveTo(px, yy); c.lineTo(px + TILE, yy); c.stroke();
          const off = (r % 2) * 10;
          for (let xx = px + off; xx < px + TILE; xx += 20) {
            c.beginPath(); c.moveTo(xx, yy); c.lineTo(xx, yy + 10); c.stroke();
          }
        }
      }
    }
  }
  // 城門の通路（石畳）
  const [gx, gy, gw, gh] = stage.goal;
  c.fillStyle = '#4a4a52';
  c.fillRect(36 * TILE, gy * TILE, 4 * TILE, gh * TILE);
  c.fillStyle = '#ddd'; c.font = 'bold 16px sans-serif'; c.textAlign = 'center';
  c.fillText('ジャキ城', 38 * TILE, 5 * TILE);

  // 草むら（プレイヤーの上に重ねて描くので別の画像に）
  bushLayer = document.createElement('canvas');
  bushLayer.width = W; bushLayer.height = H;
  const b = bushLayer.getContext('2d');
  for (let y = 0; y < stage.rows; y++) {
    for (let x = 0; x < stage.cols; x++) {
      if (!bushGrid[y][x]) continue;
      for (let i = 0; i < 6; i++) {
        b.fillStyle = ['#4f6b2e', '#5f7d36', '#3f5a24'][i % 3];
        b.beginPath();
        b.arc(x * TILE + 6 + rnd() * 28, y * TILE + 6 + rnd() * 28, 9 + rnd() * 7, 0, Math.PI * 2);
        b.fill();
      }
    }
  }
}

// 見張りの視界（扇形）を、岩でさえぎられた形で描く
function drawVision(g) {
  if (g.state === 'stun') return;
  const range = g.state === 'alert' ? VIEW_RANGE * 1.2 : VIEW_RANGE;
  const RAYS = 28;
  ctx.beginPath();
  ctx.moveTo(g.x, g.y);
  for (let i = 0; i <= RAYS; i++) {
    const a = g.dir - VIEW_ANGLE / 2 + VIEW_ANGLE * i / RAYS;
    const cos = Math.cos(a), sin = Math.sin(a);
    let d = 0;
    while (d < range) {
      if (solidAt(g.x + cos * d, g.y + sin * d)) break;
      d += 6;
    }
    ctx.lineTo(g.x + cos * d, g.y + sin * d);
  }
  ctx.closePath();
  if (g.state === 'alert') ctx.fillStyle = 'rgba(255,40,40,0.30)';
  else if (g.susp > 0.25 || g.state === 'search') ctx.fillStyle = 'rgba(255,150,0,0.30)';
  else ctx.fillStyle = 'rgba(255,240,80,0.22)';
  ctx.fill();
}

function drawGuard(g) {
  ctx.save();
  ctx.translate(g.x, g.y);
  // 影
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(2, 4, GUARD_R, GUARD_R * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(g.dir);
  // 体（軍服）
  ctx.fillStyle = g.state === 'stun' ? '#6a6a55' : '#4d5a2a';
  ctx.beginPath(); ctx.arc(0, 0, GUARD_R, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2b3216'; ctx.lineWidth = 2; ctx.stroke();
  // 銃
  ctx.fillStyle = '#222';
  ctx.fillRect(6, 4, 16, 4);
  // 頭（ターバン風）
  ctx.fillStyle = '#d8cfb8';
  ctx.beginPath(); ctx.arc(2, 0, 6.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // 頭上のマーク
  ctx.textAlign = 'center';
  ctx.font = 'bold 22px sans-serif';
  if (g.state === 'stun') {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText('z z', g.x, g.y - 20 - Math.sin(elapsed * 3) * 3);
  } else if (g.state === 'alert') {
    ctx.fillStyle = '#ff3030';
    ctx.fillText('!', g.x, g.y - 20);
  } else if (g.susp > 0.05 || g.state === 'search') {
    ctx.fillStyle = '#ffb000';
    ctx.fillText('?', g.x, g.y - 20);
    // 怪しさゲージ
    if (g.susp > 0.05) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(g.x - 14, g.y - 44, 28, 5);
      ctx.fillStyle = '#ffb000'; ctx.fillRect(g.x - 14, g.y - 44, 28 * g.susp, 5);
    }
  }
}

function drawPlayer() {
  const p = player;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(2, 4, PLAYER_R, PLAYER_R * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(p.dir);
  const sx = p.crouch ? 1.25 : 1, sy = p.crouch ? 0.8 : 1;   // ほふく中は平たく
  ctx.scale(sx, sy);
  // 足（歩くと動く）
  const swing = Math.sin(p.walk) * 5;
  ctx.fillStyle = '#1f2a3a';
  ctx.fillRect(-6 + swing, -8, 8, 5);
  ctx.fillRect(-6 - swing, 3, 8, 5);
  // 体（潜入用の黒い装備）
  ctx.fillStyle = '#2d3e55';
  ctx.beginPath(); ctx.arc(0, 0, PLAYER_R, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#9ec3ff'; ctx.lineWidth = 2; ctx.stroke();
  // 頭
  ctx.fillStyle = '#e0b48a';
  ctx.beginPath(); ctx.arc(3, 0, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(1, 0, 6, Math.PI * 0.5, Math.PI * 1.5); ctx.fill();
  ctx.restore();
}

function drawGoal() {
  const [gx, gy, gw, gh] = stage.goal;
  const a = 0.35 + Math.sin(elapsed * 4) * 0.2;
  ctx.fillStyle = `rgba(120,255,160,${a})`;
  ctx.fillRect(gx * TILE, gy * TILE, gw * TILE, gh * TILE);
  ctx.strokeStyle = '#8f8'; ctx.lineWidth = 2;
  ctx.strokeRect(gx * TILE, gy * TILE, gw * TILE, gh * TILE);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('城門', (gx + gw / 2) * TILE, (gy + gh / 2) * TILE + 5);
}

// 画面上の情報（警戒度・ヒントなど）
function drawHUD() {
  const W = window.innerWidth, H = window.innerHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // ステージ名
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(10, 10, 230, 58);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(stage.name, 20, 30);

  // 警戒度ゲージ
  ctx.font = '12px sans-serif';
  ctx.fillText('警戒度', 20, 52);
  ctx.fillStyle = '#333'; ctx.fillRect(68, 42, 160, 14);
  const col = alertLevel < 40 ? '#4caf50' : alertLevel < 75 ? '#ffb300' : '#ff3b30';
  ctx.fillStyle = col; ctx.fillRect(68, 42, 160 * alertLevel / 100, 14);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'right';
  ctx.fillText(Math.floor(alertLevel) + '%', 226, 53);

  // 状態表示（ほふく／隠れている）
  ctx.textAlign = 'right';
  ctx.font = 'bold 14px sans-serif';
  let status = player.crouch ? 'ほふく中' : '通常';
  if (player.crouch && inBush(player.x, player.y)) status = '草むらに隠れている';
  // 画面が狭い（スマホ縦）ときは、ステージ名の下に並べる
  const narrow = W < 460;
  const sx = narrow ? 10 : W - 190, sy = narrow ? 74 : 10;
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(sx, sy, 180, 28);
  ctx.fillStyle = player.crouch ? '#9ec3ff' : '#fff';
  ctx.fillText(status, sx + 10, sy + 19);

  // 気絶させられる時の案内
  if (findStunTarget()) {
    ctx.fillStyle = 'rgba(200,40,40,0.8)';
    ctx.fillRect(sx, sy + 34, 180, 28);
    ctx.fillStyle = '#fff';
    ctx.fillText('ACTION：気絶させる', sx + 10, sy + 53);
  }

  // 見つかった時は画面のふちを赤く
  if (guards.some(g => g.state === 'alert')) {
    ctx.strokeStyle = `rgba(255,0,0,${0.4 + Math.sin(elapsed * 10) * 0.2})`;
    ctx.lineWidth = 12;
    ctx.strokeRect(0, 0, W, H);
  }

  // ヒント（画面上部中央付近）
  const tx = player.x / TILE, ty = player.y / TILE;
  let hint = introTimer > 0 ? stage.intro : '';
  if (!hint) {
    const h = stage.hints.find(h => tx >= h.area[0] && tx < h.area[0] + h.area[2] &&
                                    ty >= h.area[1] && ty < h.area[1] + h.area[3]);
    if (h) hint = h.text;
  }
  if (hint) drawTextBox(hint, W / 2, narrow ? 144 : 84, Math.min(W - 20, 560));
}

// 折り返し付きのメッセージボックス
function drawTextBox(text, cx, top, maxW) {
  ctx.font = '14px sans-serif';
  const lines = [];
  let line = '';
  for (const ch of text) {
    if (ctx.measureText(line + ch).width > maxW - 24) { lines.push(line); line = ch; }
    else line += ch;
  }
  if (line) lines.push(line);
  const h = lines.length * 20 + 14;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(cx - maxW / 2, top, maxW, h);
  ctx.strokeStyle = 'rgba(158,195,255,0.6)'; ctx.lineWidth = 1;
  ctx.strokeRect(cx - maxW / 2 + 0.5, top + 0.5, maxW - 1, h - 1);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  lines.forEach((l, i) => ctx.fillText(l, cx, top + 24 + i * 20));
}

// タイトル・クリア・ゲームオーバーなどの全画面表示
function drawScreen(title, sub, lines, color) {
  const W = window.innerWidth, H = window.innerHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = color;
  ctx.font = `bold ${Math.min(40, W / 12)}px sans-serif`;
  ctx.fillText(title, W / 2, H * 0.3);
  ctx.fillStyle = '#ccc';
  ctx.font = `${Math.min(18, W / 26)}px sans-serif`;
  ctx.fillText(sub, W / 2, H * 0.3 + 38);
  ctx.font = `${Math.min(15, W / 30)}px sans-serif`;
  ctx.fillStyle = '#eee';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, H * 0.46 + i * 26));
  ctx.fillStyle = `rgba(255,255,255,${0.6 + Math.sin(performance.now() / 300) * 0.4})`;
  ctx.font = `bold ${Math.min(18, W / 24)}px sans-serif`;
  ctx.fillText('SPACE / ACTIONボタン / タップ で進む', W / 2, H * 0.82);
}

// タイトル画面の背景（簡単な城のシルエット）
function drawTitleBG() {
  const W = window.innerWidth, H = window.innerHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#1b1f3a'); grad.addColorStop(0.7, '#6b4a3a'); grad.addColorStop(1, '#b89a6a');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#111';
  const base = H * 0.72, cx = W / 2;
  ctx.fillRect(cx - 160, base - 90, 320, 90);
  for (let i = -160; i < 160; i += 30) ctx.fillRect(cx + i, base - 106, 18, 16);
  ctx.fillRect(cx - 40, base - 170, 80, 80);
  ctx.fillRect(cx - 200, base - 130, 50, 130);
  ctx.fillRect(cx + 150, base - 130, 50, 130);
  ctx.fillStyle = '#ffcf6a';
  ctx.fillRect(cx - 8, base - 150, 16, 22);
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (scene === 'title') {
    drawTitleBG();
    drawScreen('潜入作戦 ジャキ城奪還', '― ドラマ「VIVANT」モチーフのファンメイド潜入アクション ―', [
      '見張りの視界（黄色い扇形）を避けて進め',
      '移動：矢印キー / 左下パッド　アクション：SPACE / ACTIONボタン',
      'アクション＝ほふく切り替え・背後から気絶',
    ], '#ffcf6a');
    return;
  }

  // --- カメラ：プレイヤーを中心に、ステージの外は映さない ---
  const W = stage.cols * TILE, H = stage.rows * TILE;
  let camX = player.x - viewW / 2, camY = player.y - viewH / 2;
  camX = viewW >= W ? (W - viewW) / 2 : Math.max(0, Math.min(W - viewW, camX));
  camY = viewH >= H ? (H - viewH) / 2 : Math.max(0, Math.min(H - viewH, camY));
  ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, -camX * dpr * zoom, -camY * dpr * zoom);

  ctx.drawImage(staticLayer, 0, 0);
  drawGoal();
  guards.forEach(drawVision);
  drawPlayer();
  guards.forEach(drawGuard);
  // 草むらはプレイヤーの上に半透明で重ねる（隠れている感じを出す）
  ctx.globalAlpha = 0.8;
  ctx.drawImage(bushLayer, 0, 0);
  ctx.globalAlpha = 1;

  drawHUD();

  if (scene === 'clear') {
    drawScreen('STAGE 1 CLEAR', '城門への潜入に成功した', [
      `タイム：${elapsed.toFixed(1)} 秒　／　最終警戒度：${Math.floor(alertLevel)}%`,
      '次は「城壁・中庭」…（ステージ2は今後追加予定）',
    ], '#8f8');
  } else if (scene === 'over') {
    drawScreen('GAME OVER', overReason, ['もう一度挑戦する'], '#ff5050');
  }
}

/* =========================================================
   メインループ
   ========================================================= */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);  // 処理落ち時に飛びすぎないよう上限
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
