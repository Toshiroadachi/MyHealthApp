<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="腹筋タイマー">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<title>腹筋タイマー</title>
<style>
:root{
  --bg:#f2f4f7;--card:#fff;--text:#1c1f26;--sub:#6b7280;--line:#e5e7eb;--soft:#eef1f5;
  --work:#e5484d;--rest:#22a861;--prep:#4f8ef7;--accent:#4f8ef7;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1115;--card:#1a1d23;--text:#eef0f3;--sub:#9aa1ad;--line:#2a2f37;--soft:#242830}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  -webkit-text-size-adjust:100%;transition:background .3s}
body.work{background:color-mix(in srgb,var(--work) 12%,var(--bg))}
body.rest{background:color-mix(in srgb,var(--rest) 12%,var(--bg))}
body.prep{background:color-mix(in srgb,var(--prep) 10%,var(--bg))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px);
  min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
header h1{font-size:20px;margin:0}
header a{color:var(--accent);font-weight:700;text-decoration:none;font-size:14px}
.phase{text-align:center;font-size:30px;font-weight:900;margin-top:10px;letter-spacing:.05em}
.next{text-align:center;color:var(--sub);font-weight:700;min-height:22px;margin-top:2px}
.ring{position:relative;width:min(78vw,320px);aspect-ratio:1;margin:12px auto 6px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--line);stroke-width:14}
.ring .bar{fill:none;stroke:var(--c,var(--accent));stroke-width:14;stroke-linecap:round;transition:stroke .3s}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:min(30vw,120px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.ring .num span{color:var(--sub);font-weight:700;margin-top:4px}
.dots{display:flex;justify-content:center;gap:10px;margin:10px 0 4px;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--work)}
.dots i.cur{background:var(--card);box-shadow:0 0 0 3px var(--work) inset}
.round{text-align:center;font-size:18px;font-weight:800}
.total{text-align:center;color:var(--sub);font-size:13px;margin-top:2px}
.btns{display:flex;gap:12px;margin-top:18px}
.btn{flex:1;padding:18px;border-radius:18px;font-size:20px;font-weight:900;background:var(--card);border:1.5px solid var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.big{padding:24px;font-size:26px}
.card{background:var(--card);border-radius:18px;padding:6px 14px;margin-top:18px}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row label{font-weight:700}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:40px;height:40px;border-radius:12px;background:var(--soft);font-size:22px;font-weight:700}
.stp output{min-width:62px;text-align:center;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
details{margin-top:4px;padding:6px 0 10px;border-top:1px solid var(--line)}
summary{font-weight:700;padding:6px 0;cursor:pointer}
textarea{width:100%;min-height:150px;font:inherit;font-size:16px;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--text)}
.hint{color:var(--sub);font-size:12px;line-height:1.6;margin-top:12px}
.done-msg{text-align:center;margin-top:30px}
.done-msg div{font-size:64px}
.done-msg h2{font-size:26px;margin:8px 0 4px}
.hidden{display:none!important}
body.has-video .ring{width:min(44vw,176px);margin:4px auto 0}
body.has-video .ring .num b{font-size:min(17vw,68px)}
body.has-video .ring .num span{display:none}
body.has-video .phase{font-size:22px;margin-top:0}
body.has-video header{margin-bottom:0}
body.has-video .dots{margin:6px 0 2px}
body.has-video .dots i{width:12px;height:12px}
body.has-video .vcard{margin-top:10px;padding:8px}
body.has-video .btns{margin-top:10px}
body.has-video .btn{padding:14px}
.vcard{background:var(--card);border-radius:18px;padding:12px;margin-top:14px}
.vcard video{width:100%;border-radius:12px;background:#000;display:block;aspect-ratio:16/9}
.vrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.chipbtn{padding:8px 12px;border-radius:99px;background:var(--soft);font-weight:700;font-size:14px}
.chipbtn.on{background:var(--accent);color:#fff}
.vnote{color:var(--sub);font-size:12px;line-height:1.6;margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <header><h1>腹筋タイマー</h1></header>

  <!-- 実行中 -->
  <section id="runView">
    <div class="phase" id="phase">準備</div>
    <div class="next" id="next"></div>
    <div class="ring" id="ring">
      <svg viewBox="0 0 260 260"><circle class="track" cx="130" cy="130" r="115"/><circle class="bar" id="bar" cx="130" cy="130" r="115"/></svg>
      <div class="num"><b id="sec">20</b><span id="unit">秒</span></div>
    </div>
    <div class="round" id="round"></div>
    <div class="dots" id="dots"></div>
    <div class="total" id="total"></div>
    <div class="btns" id="ctrl"></div>
  </section>

  <!-- 動画（iPhone内の動画を選んで、この端末の中だけに保存） -->
  <section class="vcard" id="vcard">
    <div id="vEmpty">
      <button class="btn" style="width:100%;font-size:17px" data-act="pickVideo">🎬 動画を選ぶ（iPhone内の動画）</button>
      <div class="vnote">選んだ動画はこのアプリの中（この端末）だけに保存され、インターネットには送られません。一度選べば次回からも使えます。</div>
    </div>
    <div id="vHas" class="hidden">
      <video id="vid" playsinline preload="auto" controls></video>
      <div class="vrow">
        <button class="chipbtn" id="vSyncBtn" data-act="toggleSync"></button>
        <button class="chipbtn" id="vMuteBtn" data-act="toggleMute"></button>
      </div>
      <div class="vrow" id="vAdjRow">
        <span class="vnote" style="margin:0">ずれ調整</span>
        <button class="chipbtn" data-act="vAdj" data-d="-0.25">− 0.25秒</button>
        <b id="vOffset" style="min-width:64px;text-align:center"></b>
        <button class="chipbtn" data-act="vAdj" data-d="0.25">＋ 0.25秒</button>
      </div>
      <div class="vrow">
        <button class="chipbtn" data-act="pickVideo">動画を変更</button>
        <button class="chipbtn" data-act="removeVideo">動画を削除</button>
      </div>
      <div class="vnote" id="vSyncNote"></div>
    </div>
    <input type="file" id="vFile" accept="video/*" hidden>
  </section>

  <!-- 終了 -->
  <section id="doneView" class="hidden">
    <div class="done-msg"><div>🎉</div><h2>おつかれさまでした！</h2><div class="total" id="doneInfo"></div></div>
    <div class="btns"><button class="btn big primary" data-act="start">もう一度</button></div>
  </section>

  <!-- 設定（待機中のみ） -->
  <section id="settings" class="card">
    <div class="row"><label>トレーニング</label><div class="stp"><button data-act="adj" data-k="work" data-d="-5">−</button><output id="o-work"></output><button data-act="adj" data-k="work" data-d="5">＋</button></div></div>
    <div class="row"><label>休憩</label><div class="stp"><button data-act="adj" data-k="rest" data-d="-5">−</button><output id="o-rest"></output><button data-act="adj" data-k="rest" data-d="5">＋</button></div></div>
    <div class="row"><label>種目数</label><div class="stp"><button data-act="adj" data-k="rounds" data-d="-1">−</button><output id="o-rounds"></output><button data-act="adj" data-k="rounds" data-d="1">＋</button></div></div>
    <div class="row"><label>開始前の準備</label><div class="stp"><button data-act="adj" data-k="prep" data-d="-5">−</button><output id="o-prep"></output><button data-act="adj" data-k="prep" data-d="5">＋</button></div></div>
    <details>
      <summary>種目名（任意）</summary>
      <textarea id="names" placeholder="1行に1種目ずつ入力&#10;例:&#10;クランチ&#10;レッグレイズ&#10;バイシクルクランチ"></textarea>
    </details>
  </section>
  <div class="hint" id="hint">
    ・スタートを押すと音でお知らせします（トレーニング開始・休憩開始・残り3秒・終了）<br>
    ・iPhone は本体のマナーモード（消音）がオンだと音が鳴りません<br>
    ・タイマー中は画面を開いたままにしてください
  </div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const KEY = 'ab-timer-settings';
const DEF = { work: 20, rest: 10, rounds: 7, prep: 5, names: 'シットアップ\nクランチ\nニートゥーチェスト\nツイストレッグレイズ\nバイシクルクランチ\nプランク\nマウンテンクライマー',
  // 動画の連動設定: 動画の中で1種目目が始まる秒数、連動のON/OFF、ミュート
  vWorkStart: 6.0, vSync: true, vMuted: false };
const LIMITS = { work: [5, 300], rest: [0, 300], rounds: [1, 30], prep: [0, 30] };
let cfg = { ...DEF };
try { cfg = { ...DEF, ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch (e) {}
if (!String(cfg.names || '').trim()) cfg.names = DEF.names;
const saveCfg = () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} };

const nameOf = r => (cfg.names.split('\n').map(s => s.trim()).filter(Boolean)[r - 1]) || `種目${r}`;
const fmtMS = s => `${Math.floor(s / 60)}分${s % 60 ? (s % 60) + '秒' : ''}`.replace(/^0分/, '');
// タイムライン: 準備 → (トレーニング → 休憩) × 種目数（最後の休憩なし）
function schedule() {
  const s = [];
  if (cfg.prep) s.push({ type: 'prep', dur: cfg.prep, round: 1 });
  for (let r = 1; r <= cfg.rounds; r++) {
    s.push({ type: 'work', dur: cfg.work, round: r });
    if (r < cfg.rounds && cfg.rest) s.push({ type: 'rest', dur: cfg.rest, round: r + 1 });
  }
  let t = 0; s.forEach(x => { x.start = t; t += x.dur; });
  return s;
}
const totalSec = () => schedule().reduce((a, x) => a + x.dur, 0);

/* ---------- 音 ---------- */
let ac;
function unlockAudio() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  tone(1, 0.01, 0, 0.0001); // iOS の音声を有効にするための無音
}
function tone(freq, dur, when = 0, vol = 0.5) {
  if (!ac) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
}
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const SOUND = {
  work: () => { tone(880, 0.15); tone(1320, 0.4, 0.18); vib([150, 60, 150]); },
  rest: () => { tone(660, 0.5); vib(300); },
  prep: () => tone(660, 0.15),
  tick: () => tone(990, 0.08, 0, 0.35),
  finish: () => { [784, 988, 1175, 1568].forEach((f, i) => tone(f, i === 3 ? 0.8 : 0.18, i * 0.2)); vib([200, 100, 200, 100, 400]); },
};

/* ---------- 画面を点けたままにする ---------- */
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } } catch (e) {}
}
function releaseAwake() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }

/* ---------- 動画（IndexedDB に保存） ---------- */
const DB_NAME = 'ab-timer', DB_STORE = 'files', VIDEO_KEY = 'video';
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbDo(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, mode), req = fn(tx.objectStore(DB_STORE));
    tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error);
  });
}
const vid = $('#vid');
let hasVideo = false, videoUrl = null;
function showVideo(blob) {
  if (videoUrl) URL.revokeObjectURL(videoUrl);
  hasVideo = !!blob; videoUrl = blob ? URL.createObjectURL(blob) : null;
  if (blob) vid.src = videoUrl; else vid.removeAttribute('src');
  vid.load(); render();
}
async function loadVideo() { try { showVideo(await idbDo('readonly', st => st.get(VIDEO_KEY))); } catch (e) { console.error(e); } }
$('#vFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  showVideo(f);
  try { await idbDo('readwrite', st => st.put(f, VIDEO_KEY)); }
  catch (err) { alert('動画を保存できませんでした（容量不足の可能性）。今回だけ再生できます。'); }
});
// 連動できるのは、動画と同じ 20秒/10秒/7種目 の設定のときだけ
const syncable = () => hasVideo && cfg.vSync && cfg.work === DEF.work && cfg.rest === DEF.rest && cfg.rounds === DEF.rounds;
// タイマーの経過秒 → 動画の再生位置
const videoTimeAt = el => cfg.vWorkStart - cfg.prep + el;
function syncVideo(force) {
  if (!syncable()) return;
  const vt = videoTimeAt(elapsed());
  if (vt < 0) { if (!vid.paused) vid.pause(); vid.currentTime = 0; return; }
  if (state === 'running' && vid.paused && vt < (vid.duration || Infinity)) vid.play().catch(() => {});
  if (force || Math.abs(vid.currentTime - vt) > 0.4) vid.currentTime = vt;
}

/* ---------- タイマー本体 ---------- */
let state = 'idle', sched = [], startAt = 0, pausedAt = 0, pausedTotal = 0, segIdx = -1, lastSec = null, timer = null;
const elapsed = () => ((state === 'paused' ? pausedAt : performance.now()) - startAt - pausedTotal) / 1000;

function start() {
  unlockAudio();
  sched = schedule(); state = 'running'; startAt = performance.now(); pausedTotal = 0; segIdx = -1; lastSec = null;
  keepAwake(); clearInterval(timer); timer = setInterval(tick, 100);
  if (syncable()) { vid.muted = cfg.vMuted; vid.currentTime = Math.max(0, videoTimeAt(0)); if (videoTimeAt(0) >= 0) vid.play().catch(() => {}); }
  tick(); render();
}
function pause() { if (state !== 'running') return; state = 'paused'; pausedAt = performance.now(); if (syncable()) vid.pause(); render(); }
function resume() { if (state !== 'paused') return; unlockAudio(); pausedTotal += performance.now() - pausedAt; state = 'running'; keepAwake(); syncVideo(true); render(); }
function reset() { clearInterval(timer); state = 'idle'; releaseAwake(); if (syncable()) { vid.pause(); vid.currentTime = 0; } render(); }
function finish() {
  clearInterval(timer); state = 'done'; releaseAwake(); SOUND.finish();
  $('#doneInfo').textContent = `${cfg.rounds}種目 ・ ${fmtMS(totalSec() - cfg.prep)}`;
  render();
}
function tick() {
  if (state !== 'running') return;
  const el = elapsed(), last = sched[sched.length - 1];
  if (el >= last.start + last.dur) { finish(); return; }
  const i = sched.findIndex(s => el < s.start + s.dur);
  const seg = sched[i], remain = Math.ceil(seg.start + seg.dur - el);
  if (i !== segIdx) { segIdx = i; lastSec = remain; SOUND[seg.type](); }
  else if (remain !== lastSec) { lastSec = remain; if (remain <= 3) SOUND.tick(); }
  draw(seg, seg.start + seg.dur - el, remain);
  syncVideo(false);
}

/* ---------- 描画 ---------- */
const C = 2 * Math.PI * 115;
const LABEL = { prep: '準備', work: 'トレーニング', rest: '休憩' };
const COLOR = { prep: 'var(--prep)', work: 'var(--work)', rest: 'var(--rest)' };
function dots(cur, type) {
  return Array.from({ length: cfg.rounds }, (_, k) => {
    const r = k + 1, done = r < cur || (r === cur && type === 'done');
    return `<i class="${done ? 'done' : r === cur && type === 'work' ? 'cur' : ''}"></i>`;
  }).join('');
}
// 背景色（準備・トレーニング・休憩）だけを切り替える
const setPhase = t => { ['prep', 'work', 'rest'].forEach(c => document.body.classList.toggle(c, c === t)); };
function draw(seg, remainExact, remain) {
  setPhase(seg.type);
  $('#phase').textContent = LABEL[seg.type];
  $('#phase').style.color = COLOR[seg.type];
  $('#next').textContent = seg.type === 'work' ? nameOf(seg.round) : `次: ${nameOf(seg.round)}`;
  $('#sec').textContent = remain;
  const bar = $('#bar');
  bar.style.setProperty('--c', COLOR[seg.type]);
  bar.setAttribute('stroke-dasharray', C);
  bar.setAttribute('stroke-dashoffset', C * (1 - Math.max(0, remainExact) / seg.dur));
  $('#round').textContent = `${seg.round} / ${cfg.rounds} 種目`;
  $('#dots').innerHTML = dots(seg.round, seg.type);
  $('#total').textContent = `残り 全体 ${fmtMS(Math.ceil(totalSec() - elapsed()))}`;
}
function render() {
  const idle = state === 'idle', done = state === 'done';
  $('#runView').classList.toggle('hidden', done);
  $('#doneView').classList.toggle('hidden', !done);
  $('#settings').classList.toggle('hidden', !idle);
  $('#hint').classList.toggle('hidden', !idle);
  ['work', 'rest', 'rounds', 'prep'].forEach(k => $('#o-' + k).textContent = cfg[k] + (k === 'rounds' ? '種目' : '秒'));
  if (idle) {
    setPhase('');
    $('#phase').textContent = 'スタート待ち'; $('#phase').style.color = '';
    $('#next').textContent = nameOf(1);
    $('#sec').textContent = cfg.work;
    $('#bar').setAttribute('stroke-dasharray', C); $('#bar').setAttribute('stroke-dashoffset', 0);
    $('#bar').style.setProperty('--c', 'var(--work)');
    $('#round').textContent = `${cfg.work}秒 トレーニング ／ ${cfg.rest}秒 休憩 × ${cfg.rounds}種目`;
    $('#dots').innerHTML = dots(0, 'idle');
    $('#total').textContent = `合計 ${fmtMS(totalSec())}（準備${cfg.prep}秒を含む）`;
  }
  if (done) setPhase('');
  document.body.classList.toggle('has-video', hasVideo);
  $('#vEmpty').classList.toggle('hidden', hasVideo);
  $('#vHas').classList.toggle('hidden', !hasVideo);
  $('#vSyncBtn').textContent = cfg.vSync ? '🔗 タイマーと連動 ON' : 'タイマーと連動 OFF';
  $('#vSyncBtn').classList.toggle('on', cfg.vSync);
  $('#vMuteBtn').textContent = cfg.vMuted ? '🔇 動画の音 OFF' : '🔊 動画の音 ON';
  $('#vAdjRow').classList.toggle('hidden', !cfg.vSync);
  $('#vOffset').textContent = (cfg.vWorkStart - DEF.vWorkStart >= 0 ? '+' : '') + (cfg.vWorkStart - DEF.vWorkStart).toFixed(2) + '秒';
  vid.muted = cfg.vMuted;
  $('#vSyncNote').textContent = !cfg.vSync ? '動画は下の再生ボタンで自由に再生できます。'
    : syncable() ? 'スタートを押すと、タイマーに合わせて動画も自動で再生されます。動画の方が早い/遅いときは「ずれ調整」で直せます。'
    : '連動は「20秒・10秒・7種目」の設定のときだけ使えます。今は動画を手動で再生してください。';
  $('#ctrl').innerHTML = idle ? '<button class="btn big primary" data-act="start">スタート</button>'
    : state === 'running' ? '<button class="btn" data-act="reset">やめる</button><button class="btn primary" data-act="pause">一時停止</button>'
    : state === 'paused' ? '<button class="btn" data-act="reset">やめる</button><button class="btn primary" data-act="resume">再開</button>' : '';
  if (state === 'paused') { $('#phase').textContent = '一時停止中'; $('#phase').style.color = 'var(--sub)'; }
}

/* ---------- 操作 ---------- */
const actions = {
  start, pause, resume,
  reset: () => { if (confirm('タイマーを終了しますか？')) reset(); },
  pickVideo: () => $('#vFile').click(),
  removeVideo: async () => {
    if (!confirm('保存した動画を削除しますか？')) return;
    try { await idbDo('readwrite', st => st.delete(VIDEO_KEY)); } catch (e) {}
    showVideo(null);
  },
  toggleSync: () => { cfg.vSync = !cfg.vSync; saveCfg(); render(); },
  toggleMute: () => { cfg.vMuted = !cfg.vMuted; saveCfg(); render(); },
  vAdj: el => { cfg.vWorkStart = Math.round((cfg.vWorkStart + +el.dataset.d) * 100) / 100; saveCfg(); if (state === 'running') syncVideo(true); render(); },
  adj: el => {
    const k = el.dataset.k, [lo, hi] = LIMITS[k];
    cfg[k] = Math.min(hi, Math.max(lo, cfg[k] + +el.dataset.d)); saveCfg(); render();
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && actions[el.dataset.act]) { e.preventDefault(); actions[el.dataset.act](el); }
});
$('#names').value = cfg.names;
$('#names').addEventListener('input', e => { cfg.names = e.target.value; saveCfg(); render(); });
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state === 'running') { keepAwake(); if (ac && ac.state === 'suspended') ac.resume(); tick(); }
});
render();
loadVideo();
</script>
</body>
</html>
